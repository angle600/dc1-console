name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 语法检查
        run: |
          python -m py_compile \
            cli/dc1ctl.py \
            tools/mp_deploy.py \
            tools/dc1ctl.py \
            firmware/micropython/*.py

      - name: 固件逻辑单测（定时单次/每周、倒计时、电量）
        run: python tests/test_store.py

      - name: JSON 配置校验
        run: |
          python - <<'PY'
          import glob, json
          for f in glob.glob("firmware/micropython/*.json"):
              json.load(open(f, encoding="utf-8"))
              print("json ok:", f)
          PY

      - name: Markdown 链接粗检（本地相对链接存在性）
        run: |
          python - <<'PY'
          import os, re, sys
          bad = []
          for root, _, files in os.walk("."):
              if "/.git" in root or root.startswith("./.github"):
                  continue
              for fn in files:
                  if not fn.endswith(".md"):
                      continue
                  p = os.path.join(root, fn)
                  txt = open(p, encoding="utf-8").read()
                  for m in re.finditer(r"\[[^\]]*\]\((?!https?:|#)([^)]+)\)", txt):
                      t = m.group(1).split("#")[0]
                      if not t:
                          continue
                      if not os.path.exists(os.path.normpath(os.path.join(root, t))):
                          bad.append(f"{p} -> {t}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("links ok")
          PY
