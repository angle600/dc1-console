<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>电源开关与 IO0/EN 驱动电路</title>
<desc>VBUS 经 AMS1117 转 3.3V，再由 AO3401 P-MOS 高边开关给 ESP 供电；GP4 经 2N7002 反相驱动栅极，GP2/GP3 各经一只 2N7002 开漏拉低 ESP 的 GPIO0 与 EN。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="560" fill="#14181f"/>

<text x="40" y="102" fill="#E6F1FB" font-size="12">Pico VBUS</text>
<text x="40" y="118" fill="#85B7EB" font-size="10">Pin 40 · 5V</text>
<line x1="108" y1="105" x2="144" y2="105" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150" y="80" width="120" height="50" rx="6" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
<text x="210" y="102" text-anchor="middle" fill="#FAEEDA" font-size="11">U1 AMS1117-3.3</text>
<text x="210" y="118" text-anchor="middle" fill="#EF9F27" font-size="9">5V → 3.3V · 800mA</text>
<line x1="270" y1="105" x2="324" y2="105" stroke="#F09595" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="330" y="80" width="120" height="50" rx="6" fill="#501313" stroke="#F09595" stroke-width="0.5"/>
<text x="390" y="102" text-anchor="middle" fill="#FCEBEB" font-size="11">Q1 AO3401</text>
<text x="390" y="118" text-anchor="middle" fill="#F09595" font-size="9">P-MOS 高边开关</text>
<line x1="450" y1="105" x2="496" y2="105" stroke="#F09595" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="502" y="101" fill="#FCEBEB" font-size="12">ESP 3V3</text>
<text x="502" y="117" fill="#F09595" font-size="9">10µ + 100nF + 470µ</text>

<line x1="390" y1="130" x2="390" y2="175" stroke="#F09595" stroke-width="1.2"/>
<line x1="250" y1="175" x2="390" y2="175" stroke="#F09595" stroke-width="1.2"/>
<line x1="280" y1="175" x2="280" y2="105" stroke="#EF9F27" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="286" y="150" fill="#EF9F27" font-size="10">10 kΩ 上拉</text>
<text x="286" y="164" fill="#854F0B" font-size="9">栅源同电位 = 默认关断</text>

<text x="40" y="249" fill="#E6F1FB" font-size="12">GP4</text>
<text x="40" y="264" fill="#85B7EB" font-size="9">Pin 6</text>
<line x1="72" y1="245" x2="114" y2="245" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="118" y="232" width="70" height="26" rx="4" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="153" y="249" text-anchor="middle" fill="#EAF3DE" font-size="10">100 Ω</text>
<line x1="188" y1="245" x2="201" y2="245" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="205" y="215" width="90" height="60" rx="6" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="250" y="243" text-anchor="middle" fill="#EAF3DE" font-size="11">Q4 2N7002</text>
<text x="250" y="260" text-anchor="middle" fill="#97C459" font-size="9">N-MOS</text>
<line x1="250" y1="215" x2="250" y2="177" stroke="#F09595" stroke-width="1.2"/>
<line x1="250" y1="275" x2="250" y2="292" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="240" y1="292" x2="260" y2="292" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="243" y1="296" x2="257" y2="296" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="246" y1="300" x2="254" y2="300" stroke="#B4B2A9" stroke-width="1.2"/>

<text x="40" y="360" fill="#E6F1FB" font-size="12">GP2</text>
<text x="40" y="375" fill="#85B7EB" font-size="9">Pin 4</text>
<line x1="72" y1="356" x2="114" y2="356" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="118" y="343" width="70" height="26" rx="4" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="153" y="360" text-anchor="middle" fill="#EAF3DE" font-size="10">100 Ω</text>
<line x1="188" y1="356" x2="201" y2="356" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="205" y="330" width="90" height="60" rx="6" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="250" y="358" text-anchor="middle" fill="#EAF3DE" font-size="11">Q2 2N7002</text>
<text x="250" y="375" text-anchor="middle" fill="#97C459" font-size="9">N-MOS</text>
<line x1="295" y1="360" x2="338" y2="360" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="344" y="356" fill="#FAEEDA" font-size="12">ESP GPIO0</text>
<text x="344" y="371" fill="#EF9F27" font-size="9">模块内部 10k 上拉</text>
<line x1="250" y1="390" x2="250" y2="407" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="240" y1="407" x2="260" y2="407" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="243" y1="411" x2="257" y2="411" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="246" y1="415" x2="254" y2="415" stroke="#B4B2A9" stroke-width="1.2"/>

<text x="40" y="465" fill="#E6F1FB" font-size="12">GP3</text>
<text x="40" y="480" fill="#85B7EB" font-size="9">Pin 5</text>
<line x1="72" y1="461" x2="114" y2="461" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="118" y="448" width="70" height="26" rx="4" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="153" y="465" text-anchor="middle" fill="#EAF3DE" font-size="10">100 Ω</text>
<line x1="188" y1="461" x2="201" y2="461" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="205" y="435" width="90" height="60" rx="6" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="250" y="463" text-anchor="middle" fill="#EAF3DE" font-size="11">Q3 2N7002</text>
<text x="250" y="480" text-anchor="middle" fill="#97C459" font-size="9">N-MOS</text>
<line x1="295" y1="465" x2="338" y2="465" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="344" y="461" fill="#FAEEDA" font-size="12">ESP EN / CH_PD</text>
<text x="344" y="476" fill="#EF9F27" font-size="9">外部 10k 上拉到 ESP 3V3</text>
<line x1="250" y1="495" x2="250" y2="512" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="240" y1="512" x2="260" y2="512" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="243" y1="516" x2="257" y2="516" stroke="#B4B2A9" stroke-width="1.2"/>
<line x1="246" y1="520" x2="254" y2="520" stroke="#B4B2A9" stroke-width="1.2"/>

<text x="40" y="542" fill="#6B7280" font-size="10">三只 N-MOS 源极共 GND；GPIO=1 导通 = 把对应 ESP 引脚拉到 0V。ESP 断电时栅极务必为 0。</text>
</svg>
